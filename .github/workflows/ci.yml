name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # ConfigModule valida esto al bootstrapear AppModule (lint/build no
      # necesitan una conexión real: pg.Pool no conecta hasta la primera
      # query). Los tests de integración usan su propio Postgres real vía
      # testcontainers, sin relación con esta variable.
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci_not_connected
      # Mismo motivo que DATABASE_URL: ConfigModule valida solo la forma
      # (string no vacío). Nada en lint/build/e2e llama a las APIs reales
      # de Anthropic/Google — AnthropicProvider/GoogleProvider solo se
      # instancian al bootstrapear AppModule, no se invocan.
      ANTHROPIC_API_KEY: ci-not-a-real-key
      GEMINI_API_KEY: ci-not-a-real-key
      CANVAS_BASE_URL: https://canvas.ci.local
      CANVAS_API_TOKEN: ci-not-a-real-token
      TELEGRAM_BOT_TOKEN: ci-fake-token
      TELEGRAM_OWNER_CHAT_ID: 123456789
      TELEGRAM_WEBHOOK_SECRET: ci-fake-secret
      GOOGLE_CLIENT_ID: ci-not-a-real-id
      GOOGLE_CLIENT_SECRET: ci-not-a-real-secret
      GOOGLE_REFRESH_TOKEN: ci-not-a-real-token
      # src/memory: mismo motivo que ANTHROPIC_API_KEY/GEMINI_API_KEY —
      # EmbeddingProvider solo se instancia al bootstrapear AppModule,
      # nunca se invoca en lint/test/build/e2e.
      OPENAI_API_KEY: ci-not-a-real-key
      # src/executor-client (Fase 5.2): mismo motivo — ExecutorClientService
      # solo se instancia al bootstrapear AppModule, ninguna llamada HTTP
      # real ocurre en lint/test/build/e2e.
      EXECUTOR_BASE_URL: http://executor.ci.local
      # src/auth (Fase 6.1): mismo motivo — hash/secret sintácticamente
      # válidos, nunca se verifica una contraseña real en lint/build/e2e.
      OWNER_PASSWORD_HASH: '$argon2id$v=19$m=65536,t=3,p=4$Y2ktZmFrZS1zYWx0$Y2ktZmFrZS1oYXNo'
      JWT_SECRET: ci-fake-jwt-secret-at-least-32-characters-long
      # src/rate-limit (Fase 6.1): mismo motivo que DATABASE_URL —
      # `RedisThrottlerStorage` usa `lazyConnect: true`, no conecta hasta
      # el primer comando. Los tests de integración de rate-limit usan su
      # propio Redis real vía testcontainers.
      REDIS_URL: redis://ci:6379
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Install pnpm
        uses: pnpm/action-setup@v3
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run test
      - run: pnpm run test:e2e
      - run: pnpm run test:integration
      - run: pnpm run build
      - run: pnpm run generate:contract
      # El contrato commiteado tiene que ser exactamente el que genera el código:
      # Web y CLI generan sus tipos desde ese archivo (regla de oro #11), y un
      # contrato desactualizado o mentiroso rompe a los consumidores en silencio.
      - name: contracts/openapi.json está al día
        run: git diff --exit-code contracts/openapi.json

  # Control que faltaba (docs/runbooks/STATUS_DEPLOY.md, Jin_Docs): el job
  # `docker` solo compila y publica, NUNCA ejecutaba la imagen. Por eso
  # llegaron a GHCR imágenes que no podían arrancar (CMD a un archivo
  # inexistente, config/ sin copiar, sqlite-vec sin poder cargar en Alpine).
  # Acá se construye la imagen y se levanta de verdad: si /health/live no
  # responde 200, el CI falla y `docker` no publica.
  # amd64 nativo a propósito (rápido); el arm64 real se compila en `docker`.
  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image (solo para el smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: jin-core:smoke
      - name: Arrancar el contenedor y esperar /health/live
        run: |
          docker run -d --name jin-smoke -p 3000:3000 \
            -e NODE_ENV=production \
            -e MEMORY_DB_PATH=/tmp/memory.db \
            -e DATABASE_URL=postgres://ci:ci@127.0.0.1:5432/ci_not_connected \
            -e REDIS_URL=redis://127.0.0.1:6379 \
            -e ANTHROPIC_API_KEY=ci-not-a-real-key \
            -e GEMINI_API_KEY=ci-not-a-real-key \
            -e OPENAI_API_KEY=ci-not-a-real-key \
            -e CANVAS_BASE_URL=https://canvas.ci.local \
            -e CANVAS_API_TOKEN=ci-not-a-real-token \
            -e TELEGRAM_BOT_TOKEN=ci-fake-token \
            -e TELEGRAM_OWNER_CHAT_ID=123456789 \
            -e TELEGRAM_WEBHOOK_SECRET=ci-fake-secret \
            -e GOOGLE_CLIENT_ID=ci-not-a-real-id \
            -e GOOGLE_CLIENT_SECRET=ci-not-a-real-secret \
            -e GOOGLE_REFRESH_TOKEN=ci-not-a-real-token \
            -e EXECUTOR_BASE_URL=http://executor.ci.local \
            -e OWNER_PASSWORD_HASH='$argon2id$v=19$m=65536,t=3,p=4$Y2ktZmFrZS1zYWx0$Y2ktZmFrZS1oYXNo' \
            -e JWT_SECRET=ci-fake-jwt-secret-at-least-32-characters-long \
            jin-core:smoke
          for i in $(seq 1 45); do
            if curl -fsS http://localhost:3000/health/live; then
              echo
              echo "smoke OK: /health/live respondió 200"
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' jin-smoke)" != "true" ]; then
              echo "el contenedor murió antes de responder"
              break
            fi
            sleep 2
          done
          echo "----- logs del contenedor -----"
          docker logs jin-smoke
          exit 1
      - name: Regresión Fase 8.1 -- los secretos de Infisical se cargan ANTES de validar el entorno
        run: |
          # Con INFISICAL_ENABLED=true y un Infisical inalcanzable, el proceso debe
          # fallar en el LOGIN a Infisical (loadSecrets), no en la validación del
          # entorno. Si `validateEnv()` corre antes que `loadSecrets()` (import
          # estático de AppModule: ConfigModule.forRoot se ejecuta al importar), la
          # imagen es inservible en producción y ningún otro test lo veía porque
          # todos pasan el entorno completo por variables.
          set +e
          out="$(docker run --rm \
            -e NODE_ENV=production \
            -e INFISICAL_ENABLED=true \
            -e INFISICAL_CLIENT_ID=ci -e INFISICAL_CLIENT_SECRET=ci \
            -e INFISICAL_PROJECT_ID=ci -e INFISICAL_SITE_URL=http://127.0.0.1:9 \
            jin-core:smoke 2>&1)"
          echo "$out" | head -20
          if echo "$out" | grep -q "Configuración de entorno inválida"; then
            echo "FALLO: validateEnv() corrió antes de loadSecrets()."
            exit 1
          fi
          if ! echo "$out" | grep -q "InfisicalSDKError"; then
            echo "FALLO: el proceso no llegó a intentar hablar con Infisical."
            exit 1
          fi
          echo "OK: loadSecrets() corre antes de validateEnv()."

  docker:
    needs: [build, container-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Runner ARM64 NATIVO (GA para repos públicos desde 2025-08): el nodo K3s es
    # Ampere/arm64, y emular con QEMU hacía que este job colgara -- 2 cuelgues de 6 h
    # el 2026-09-19 y 2 más el 2026-09-21 (57 min y 25 min) frente a ~5 min normales.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          # Prohibido `latest` (Fase 7.1): tag único y determinista por
          # commit, para que Flux/rollback nunca sean ambiguos.
          tags: ghcr.io/jfrnck/jin-core:${{ github.sha }}
