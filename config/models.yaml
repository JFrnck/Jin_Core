# Mapa TaskProfile → modelo (docs/MODEL_ROUTING.md §2.1). NO se hardcodea
# en código — todo modelo pasa por src/model-provider/ leyendo este archivo
# (MODEL_ROUTING.md §6.1). Actualizar este archivo y MODEL_ROUTING.md en
# el mismo PR cuando cambie un modelo (§6.3).
profiles:
  reasoning_heavy:
    description: "Razonamiento complejo, debug, arquitectura"
    primary: claude-opus-4-8
    fallback: claude-sonnet-5
    max_tokens_input: 200000
    max_tokens_output: 8000
    temperature: 0.3

  coding_default:
    description: "Generación y edición de código diario"
    primary: claude-sonnet-5
    fallback: gemini-3.5-flash
    max_tokens_input: 100000
    max_tokens_output: 4000
    temperature: 0.2

  long_context:
    description: "Análisis de documentos largos, PDFs, hilos de correo"
    primary: gemini-3.1-pro
    fallback: claude-opus-4-8
    max_tokens_input: 1500000
    max_tokens_output: 8000
    temperature: 0.4

  extraction_fast:
    description: "Clasificación, extracción de entidades, resúmenes cortos"
    primary: claude-haiku-4-5
    fallback: gemini-2.5-flash-lite
    max_tokens_input: 32000
    max_tokens_output: 1000
    temperature: 0.1

  chat_conversational:
    description: "Chat con el usuario, respuestas conversacionales"
    primary: claude-sonnet-5
    fallback: claude-haiku-4-5
    max_tokens_input: 50000
    # Igual que max_output_tokens de config/agent.yaml (el agent loop).
    max_tokens_output: 8000
    temperature: 0.7

  code_execution_planner:
    description: "Genera código para pods Deno / Modal"
    primary: claude-opus-4-8
    fallback: claude-sonnet-5
    max_tokens_input: 100000
    max_tokens_output: 8000
    temperature: 0.2

  memory_consolidation:
    description: "Destila la sesión en entradas de memoria (sqlite-vec)"
    primary: claude-haiku-4-5
    fallback: gemini-2.5-flash-lite
    max_tokens_input: 64000
    max_tokens_output: 2000
    temperature: 0.2

  history_compaction:
    description: "Comprime un tramo viejo del historial de chat a un resumen (poda + compresión, docs/RECOMENDACIONES.md #2)"
    primary: claude-haiku-4-5
    fallback: gemini-2.5-flash-lite
    max_tokens_input: 64000
    max_tokens_output: 1000
    temperature: 0.2

  vision_analysis:
    description: "Análisis de screenshots, imágenes, gráficas"
    primary: claude-opus-4-8
    fallback: gemini-3.1-pro
    max_tokens_input: 100000
    max_tokens_output: 4000
    temperature: 0.3

# Precios por 1M tokens (docs/MODEL_ROUTING.md §1), usados por
# src/budget/cost.ts para calcular el gasto real de cada llamada. Todos
# los modelos de las tablas 1.1/1.2, no solo los que hoy aparecen en
# `profiles` arriba — evita que cambiar un primary/fallback rompa el
# cálculo de costo por falta de precio. Intro de Sonnet 5 ($2/$10 hasta
# ago 2026) no se refleja aquí: usamos el precio de lista para no
# subestimar presupuesto tras el vencimiento de la promo.
model_prices:
  claude-fable-5:
    input_per_million: 10
    output_per_million: 50
  claude-opus-4-8:
    input_per_million: 15
    output_per_million: 75
  claude-opus-4-7:
    input_per_million: 15
    output_per_million: 75
  claude-sonnet-5:
    input_per_million: 3
    output_per_million: 15
  claude-haiku-4-5:
    input_per_million: 1
    output_per_million: 5
  gemini-3.5-flash:
    input_per_million: 1.50
    output_per_million: 9
  gemini-3.1-pro:
    input_per_million: 1.25
    output_per_million: 10
  gemini-2.5-flash-lite:
    input_per_million: 0.10
    output_per_million: 0.40
  # "Uso por sandbox" (MODEL_ROUTING.md 1.2): no se factura por token,
  # así que 0/0 no es "gratis" sino "este esquema no aplica". Ningún
  # profile de runtime lo usa hoy — si alguno llegara a usarlo, el costo
  # calculado sería siempre 0 y quedaría subestimado a propósito.
  antigravity-preview-05-2026:
    input_per_million: 0
    output_per_million: 0
  # Claude Sonnet 5.5 / Opus 5.5 (2026-09-29, sucesores anunciados de Sonnet 5
  # y Opus 4.8 — mismo precio que Sonnet 5, y Opus 5.5 más barato Y más capaz
  # que Opus 4.8). Ningún profile de runtime los usa como primary/fallback
  # todavía (ver comentario en `profiles` arriba): solo elegibles a mano por
  # el owner en `chat_options`. Precio verificado contra la doc pública de
  # Anthropic al agregarlos.
  claude-sonnet-5-5:
    input_per_million: 2
    output_per_million: 10
  claude-opus-5-5:
    input_per_million: 4
    output_per_million: 20
  # OpenAI GPT-6 (2026-09-29): reemplaza la familia GPT-5.1 en `chat_options`
  # (Sol/Luna suceden a GPT-5.1/GPT-5.1-mini; Astra es el flagship nuevo, sin
  # equivalente anterior en este roster). Precio verificado contra la doc
  # pública de OpenAI al agregarlos — no estimado como la entrada que
  # reemplaza.
  gpt-6-astra:
    input_per_million: 10
    output_per_million: 50
  gpt-6-sol:
    input_per_million: 2
    output_per_million: 10
  gpt-6-luna:
    input_per_million: 0.10
    output_per_million: 0.50

# Catálogo elegible por el owner para "chat_conversational" (2026-09-28,
# preferencia de modelo — app iOS: Más → Ajustes). Curado a propósito: NO
# es "todo modelo con precio arriba", solo lo que tiene sentido para hablar
# con el owner y decidir tools en el mismo turno. `supports_effort`: si el
# modelo no tiene ningún knob de esfuerzo (Gemini todavía no, en este SDK),
# la app no muestra el selector de esfuerzo para esa opción.
# 2026-09-29: Opus 5.5/Sonnet 5.5 reemplazan a Opus 4.8/Sonnet 5 acá (mismo
# precio o mejor, y más capaces — sin motivo para que el owner siga eligiendo
# la versión vieja desde este selector). GPT-6 Astra/Sol/Luna reemplazan a
# GPT-5.1/GPT-5.1-mini igual. Esto NO toca `profiles` arriba (el default
# automático de `chat_conversational` y las demás tareas sigue en la versión
# anterior) — es deliberado, ver STATUS.md de esta sesión.
chat_options:
  - vendor: anthropic
    model: claude-opus-5-5
    label: "Claude Opus 5.5 — el más capaz"
    supports_effort: true
  - vendor: anthropic
    model: claude-sonnet-5-5
    label: "Claude Sonnet 5.5 — balanceado"
    supports_effort: true
  - vendor: anthropic
    model: claude-haiku-4-5
    label: "Claude Haiku 4.5 — rápido y barato"
    supports_effort: true
  - vendor: google
    model: gemini-3.1-pro
    label: "Gemini 3.1 Pro — contexto masivo"
    supports_effort: false
  - vendor: google
    model: gemini-3.5-flash
    label: "Gemini 3.5 Flash — agentic, rápido"
    supports_effort: false
  - vendor: openai
    model: gpt-6-astra
    label: "GPT-6 Astra — el más capaz de OpenAI"
    supports_effort: true
  - vendor: openai
    model: gpt-6-sol
    label: "GPT-6 Sol — balanceado, para código"
    supports_effort: true
  - vendor: openai
    model: gpt-6-luna
    label: "GPT-6 Luna — rápido y barato"
    supports_effort: true
