# Guardas duras del agent loop (docs/BLUEPRINT.md §6, Fase 5.1). NO se
# hardcodea en código — src/agent/ lee este archivo.
# Red de seguridad global: corta el turno pase lo que pase.
max_iterations_per_turn: 15
# Self-correction: fallos consecutivos de la MISMA tool con los MISMOS
# args antes de marcar ese intento agotado e informarlo al modelo.
max_consecutive_tool_failures: 3
# Orquestación multi-agente (Fase 5.4, ADR 0005): tope de sub-agentes
# corriendo en paralelo dentro de un mismo lote de tickets sin
# dependencias entre sí. Default bajo a propósito (requisito del owner).
max_concurrent_sub_agents: 3
# Poda + compresión del historial de chat (docs/RECOMENDACIONES.md #2 +
# requisito del owner 2026-08-04). Si el historial estimado supera este
# techo, se comprime el tramo más viejo a un resumen. ~60% del
# max_tokens_input de chat_conversational (config/models.yaml) — deja
# margen para el objective/tools/system prompt del turno actual.
max_history_tokens: 30000
# Piso infranqueable: los últimos N turnos SIEMPRE quedan verbatim, nunca
# se comprimen — no solo por UX (continuidad inmediata), sino porque es
# la única garantía estructural de que el turno actual (con tags
# <untrusted_content_{nonce}> recién creados) nunca entra a una llamada
# de compresión el mismo turno en que se generó. No puede ser 0 (ver
# validación en agent-config.schema.ts).
preserve_last_turns: 6
